# Install this file as .github/workflows/fos-release.yml in each source repository.
name: Sync FOS release
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: fos-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  sync:
    if: >-
      !github.event.release.draft && !github.event.release.prerelease &&
      (github.repository == 'Rey544/MoreIterators' || github.repository == 'Rey544/rainoctool')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check sync credential
        env:
          SYNC_TOKEN: ${{ secrets.FOS_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo '::error::Add FOS_SYNC_TOKEN with Contents read/write access to Rey544/fos-discord.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: Rey544/fos-discord
          ref: main
          token: ${{ secrets.FOS_SYNC_TOKEN }}
      - name: Record verified release and trigger FOS deployment
        env:
          SOURCE_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          git config user.name 'FOS release sync'
          git config user.email 'fos-release-sync@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python release_sync.py --repo "$SOURCE_REPO" --release-id "$RELEASE_ID"
            git add release-manifest.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Sync published release from $SOURCE_REPO"
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo '::error::Could not push release metadata. Re-run this workflow after resolving the error.'
          exit 1
